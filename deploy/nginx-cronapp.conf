# CronApp — nginx reverse proxy directives for Plesk.
#
# WHERE THIS GOES
#   Plesk → Domains → <your domain> → Apache & nginx Settings:
#     1. UNCHECK "Proxy mode" (so nginx serves directly and does not hand "/"
#        off to Apache — otherwise the location / block below is ignored).
#     2. Paste everything below into "Additional nginx directives".
#     3. Apply. Plesk validates the config and reloads nginx.
#
# Plesk already provides the `server { listen 443 ssl; server_name …; }` wrapper
# and the Let's Encrypt certificate, so only the location blocks belong here.
#
# Same-origin design: the web app calls the API at a RELATIVE "/api" path, so
# both must answer on the one public host. No CORS, no second domain.

# ── API (NestJS, PM2: cronapp-api) ────────────────────────────────────────────
# Nest sets a global "/api" prefix, so we pass the URI through unchanged
# (proxy_pass has no path component → original request URI is preserved).
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Large / streamed run responses: don't buffer, give slow jobs room.
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 25m;
}

# ── Web dashboard (Next.js, PM2: cronapp-web) ─────────────────────────────────
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

# Let Next.js serve its own hashed, immutable build assets with long caching.
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
